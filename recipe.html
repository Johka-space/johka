    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        name: params.get('name'),
        people: parseInt(params.get('people')) || 1
      };
    }

    function renderRecipe() {
      const { name, people } = getQueryParams();
      const recipe = recipes[name];
      if (!recipe) {
        document.getElementById('recipe-container').innerHTML = "<p>Recipe not found.</p>";
        return;
      }

    const adjustedIngredients = recipe.ingredients
  .map(item => {
    // Trim leading/trailing spaces once
    const nameTrimmed = item.name.trim();

    // If there's no valid numeric amount, just show the name
    if (typeof item.amount !== 'number' || isNaN(item.amount)) {
      return `<li>${nameTrimmed}</li>`;
    }
  const nameLower = item.name.toLowerCase();
  const adjustedAmount = item.amount * people / recipe.basePeople;
  let adjusted;

  if (/kg\b/.test(nameLower)) {
    // Keep kg with 2 decimal places
    adjusted = (Math.round(adjustedAmount * 20) / 20).toFixed(2);
  } else if (/g\b|ml\b/.test(nameLower)) {
    // Grams/ml → round up to integer
    adjusted = Math.ceil(adjustedAmount);
  } else {
    // Fallback: just 2 decimals
    // Keep kg with 2 decimal places
    // Fallback (e.g. things with parentheses like "onion (sliced)")
      if (adjustedAmount < 1) {
      adjusted = (Math.round(adjustedAmount * 20) / 20).toFixed(2);
    } else {
      const rounded = Math.round(adjustedAmount * 2) / 2;
      adjusted = Number.isInteger(rounded) ? rounded : rounded.toFixed(1);
    }
  }

  return `<li>${adjusted} ${item.name}</li>`;
}).join("");
